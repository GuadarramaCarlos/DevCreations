<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioTrack - Registro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* Diseño Glassmorphism aplicado al contenedor original */
        #formularioRegistro {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 45px 35px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            margin: auto; /* Centrado en pantalla */
        }

        #formularioRegistro h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 5px;
            margin-top: 0;
        }

        .registro-subtitle {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 30px;
        }

        /* Damos estilo blanco a los labels que inyecta tu JS original */
        #formularioRegistro label {
            color: white;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            padding-left: 15px;
        }

        /* Estilo para el select */
        select.entradaTexto {
            appearance: none;
            cursor: pointer;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            pointer-events: none;
        }

        /* Estilo BioTrack para el botón original */
        #btnRegistrar {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 25px;
        }

        #btnRegistrar:hover {
            background-color: #2563eb;
            transform: scale(1.02);
        }
    </style>
</head>

<body class="login-bg"> <div id="formularioRegistro">

        <h1>Crear Cuenta</h1>
        <p class="registro-subtitle">Regístrate en el sistema BioTrack</p>

        <form id="FormularioRegistro">

            <div id="contenedorInputs"></div>

            <label>Selecciona tu rol</label>
            
            <div class="select-wrapper">
                <select id="id_rol" class="entradaTexto">
                    <option value="1">Administrador</option>
                    <option value="2">Profesor</option>
                    <option value="3">Trabajador</option>
                </select>
                <i class="fa-solid fa-chevron-down"></i>
            </div>

            <button type="button" id="btnRegistrar">
                Registrar Cuenta <i class="fa-solid fa-user-plus" style="margin-left: 8px;"></i>
            </button>

        </form>

    </div>

    <a href="../index.html" class="btn-regresar">
        <i class="fa-solid fa-arrow-rotate-left icon-return"></i>
        Regresar al Login
    </a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/script_registro.js"></script>

</body>

</html>
