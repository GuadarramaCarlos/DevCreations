<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login BioTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    
    <style>
        /* Estilo sutil para el enlace de registro dentro de la tarjeta */
        .link-registro {
            display: inline-block;
            margin-top: 25px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s, transform 0.2s;
        }

        .link-registro:hover {
            color: #3b82f6; /* Azul BioTrack */
            text-decoration: underline;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="login-bg">

    <div class="biotrack-container">
        
        <div class="branding-section">
            <i class="fa-solid fa-fingerprint" style="font-size: 110px; color: #3b82f6; margin-bottom: 20px;"></i>
            <h1 class="brand-title">Bio<span>Track</span></h1>
            <p class="brand-subtitle">Sistema inteligente de gestión de asistencia</p>
        </div>

        <div id="formularioInicio">
            <h2>Iniciar Sesión</h2>
            <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass input-icon"></i>
                <input type="text" placeholder="Número de empleado (Correo)" class="entradaTexto" id="usuarioInput"> 
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" placeholder="Contraseña" class="entradaTexto" id="passInput">
            </div>
            
            <div id="mensajeFeedback" style="margin: 10px 0; min-height: 20px; font-weight: bold; border-radius: 20px;"></div>
            
            <button id="btnIngresar" class="btn-pill">
                Ingresar <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
            </button>

            <div class="divider">
                <span>O continua con</span>
            </div>

            <button id="btnHuella" class="btn-pill" onclick="window.location.href='./pages/huella.html'">
                <i class="fa-solid fa-fingerprint" style="margin-right: 8px; font-size: 18px;"></i> Huella digital
            </button>

            <a href="./pages/registro.html" class="link-registro">
                Se necesita crear una cuenta <strong>Regístrala aquí</strong>
            </a>
        </div>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/script.js"></script>

</body>
</html>
